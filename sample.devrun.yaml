# sample.devrun.yaml — copy to your project root as devrun.yaml
#
# devrun list              list everything
# devrun <name>            run a workflow or command
# devrun clean             run the "clean" workflow
# devrun clean <name>      run one workflow's clean steps
# devrun help              show help

version: 1

# ── Variables ────────────────────────────────────────────────────────────────
# ${VAR} is expanded in every string field.
# $DEVRUN_ROOT is always the directory containing devrun.yaml.

vars:
  OUT_DIR: "${DEVRUN_ROOT}/output"
  LOG_FILE: "${DEVRUN_ROOT}/output/run.log"

# ── Global env ───────────────────────────────────────────────────────────────
# Added to the process environment for every step.

env:
  APP_ENV: "development"

# ── Commands ─────────────────────────────────────────────────────────────────
# Named atomic operations — building blocks for workflows.
# Run directly:              devrun <name>
# Reference in a workflow:   - command: <name>

commands:

  # Basic shell command
  say-hello:
    description: "Print a greeting"
    run: echo "Hello from devrun! env=${APP_ENV}"

  # Command with a working directory
  list-files:
    description: "List files in the output directory"
    run: ls -la
    workdir: output

  # Create output directory — skipped if it already exists
  create-output-dir:
    description: "Create the output directory (skipped if exists)"
    run: mkdir -p output
    skip_if:
      exists: output             # file/dir existence check

  # Write a file, capture the timestamp for later steps
  write-timestamp:
    description: "Write current timestamp to a file"
    run: date
    workdir: output
    capture:
      var: BUILD_TIME            # stdout stored in $BUILD_TIME for later steps
      trim: true

  # Load env from a file (dotenv format)
  load-config:
    description: "Load local config from .env.local (if present)"
    env_from:
      - file: .env.local         # KEY=VALUE lines → shared state

  # Load a single secret from a file
  load-secret:
    description: "Load API key from secrets file"
    env_from:
      - name: API_KEY
        file: secrets/api.key
        trim: true

  # Ask the user for input at runtime
  ask-target:
    description: "Ask which environment to target"
    prompt:
      var: TARGET
      message: "Target environment"
      default: "local"

  # Ask for a password (hidden input)
  ask-password:
    description: "Ask for the deploy password"
    prompt:
      var: DEPLOY_PASSWORD
      message: "Password"
      secret: true

  # Skip if an env var is already set
  maybe-init:
    description: "Init only if INITIALIZED is not already set"
    run: echo "Initialising..."
    skip_if:
      env: INITIALIZED           # skip if this env var is non-empty

  # Skip based on a shell command's exit code
  check-tool:
    description: "Verify required tool is installed"
    run: echo "Tool is available"
    skip_if:
      cmd: which curl            # skip if curl is already on PATH (it is — just an example)

# ── Workflows ─────────────────────────────────────────────────────────────────
# Sequences of steps. A step is one of:
#   - command: <name>              reference a named command (local then global)
#   - workflow: <name>             run another workflow inline
#   - workflow: <name>, spawn: true  open another workflow in a NEW terminal
#   - run: <shell>, workdir: ...   inline anonymous command

workflows:

  # ── Setup (one-time) ───────────────────────────────────────────────────────

  setup:
    description: "One-time setup — create directories and write initial files"
    steps:
      - command: create-output-dir
      - name: write-readme
        description: "Write a placeholder README into output/"
        run: echo "Generated by devrun" > README.txt
        workdir: output
    clean:
      - description: "Remove the output directory"
        run: rm -rf output

  # ── Single-step workflow ───────────────────────────────────────────────────

  greet:
    description: "Say hello and list output files"
    steps:
      - command: say-hello
      - command: create-output-dir
      - command: list-files

  # ── Capture: use output of one step in the next ────────────────────────────

  build:
    description: "Write a build artifact stamped with the current timestamp"
    steps:
      - command: create-output-dir
      - command: write-timestamp              # captures $BUILD_TIME
      - name: write-artifact
        description: "Write artifact stamped with captured timestamp"
        run: echo "Built at ${BUILD_TIME}" > artifact.txt   # ${BUILD_TIME} expanded
        workdir: output
    clean:
      - description: "Remove artifact"
        run: rm -f artifact.txt
        workdir: output

  # ── Workflow with local commands ───────────────────────────────────────────

  report:
    description: "Generate a report (uses a workflow-local command)"
    commands:
      summarise:                             # only visible inside this workflow
        description: "Append a summary line"
        run: echo "Summary complete." >> report.txt
        workdir: output
    steps:
      - command: create-output-dir
      - name: start-report
        description: "Write report header"
        run: echo "=== Report ===" > report.txt
        workdir: output
      - command: write-timestamp             # global command
      - name: append-time
        description: "Append timestamp to report"
        run: 'echo "Time: ${BUILD_TIME}" >> report.txt'
        workdir: output
      - command: summarise                   # workflow-local command
    clean:
      - description: "Remove report"
        run: rm -f report.txt
        workdir: output

  # ── Prompt: ask user for input at runtime ─────────────────────────────────

  deploy:
    description: "Interactive deploy — prompts for target and password"
    steps:
      - command: ask-target                  # prompts → $TARGET
      - command: ask-password                # prompts (hidden) → $DEPLOY_PASSWORD
      - name: run-deploy
        description: "Simulate deploy to ${TARGET}"
        run: echo "Deploying to ${TARGET}"

  # ── Spawn: open workflows in separate terminals ────────────────────────────

  watch:
    description: "Watch two processes — each in its own terminal"
    steps:
      - workflow: watch-a
        spawn: true              # opens in new terminal
      - workflow: watch-b
        spawn: true              # opens in another new terminal

  watch-a:
    description: "Watch process A (long-running)"
    steps:
      - name: run-a
        description: "Simulate a long-running process"
        run: 'while true; do echo "A: tick"; sleep 3; done'

  watch-b:
    description: "Watch process B (long-running)"
    steps:
      - name: run-b
        description: "Simulate another long-running process"
        run: 'while true; do echo "B: tock"; sleep 5; done'

  # ── Global clean ────────────────────────────────────────────────────────────
  # devrun clean  →  runs this workflow

  clean:
    description: "Remove all generated files"
    steps:
      - name: remove-output
        description: "Remove output directory"
        run: rm -rf output
      - name: done
        description: "Done"
        run: echo "Clean complete."
